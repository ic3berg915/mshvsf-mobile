name: Gerar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Extrair o ZIP (se estiver zipado)
        run: |
          if [ -f "mshvsf-android.zip" ]; then
            echo "Encontrei o mshvsf-android.zip! Extraindo..."
            unzip -o mshvsf-android.zip
          fi
          ls -R

      - name: 4. Baixar o núcleo FBNeo (fetch_core.sh)
        run: |
          SCRIPT_PATH=$(find . -name "fetch_core.sh" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "ERRO: Voce ainda nao subiu o mshvsf-android.zip na aba Code!"
            exit 1
          fi
          PROJECT_DIR=$(dirname $(dirname "$SCRIPT_PATH"))
          cd "$PROJECT_DIR"
          chmod +x scripts/fetch_core.sh
          ./scripts/fetch_core.sh

      - name: 5. Compilar o APK (Gradle)
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 6. Salvar o APK gerado para download
        uses: actions/upload-artifact@v4
        with:
          name: mshvsf-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
